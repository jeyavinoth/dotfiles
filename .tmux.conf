set-window-option -g clock-mode-colour '#eb6f92' #rose-pine love

# setting tmux history
set-option -g history-limit 50000


# ── Rosé Pine powerline status bar ────────────────────────────────────
#  base #191724  overlay #26233a  hl-med #403d52  subtle #908caa
#  text #e0def4  love #eb6f92     gold #f6c177    iris #c4a7e7
#  powerline glyphs   need a Nerd Font (kitty = JetBrainsMono Nerd Font)
set -g status 2
set -g status-interval 15
set -g status-position bottom
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 100
set -g status-style 'bg=default,fg=#908caa'

# upper line = activity/bell notifications ; lower line = the powerline bar
set -g status-format[0] '#[bg=default] #{@notif}'
set -g status-format[1] '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'

# ── notification flash: row is empty; a hook sets @notif briefly, a bg timer clears it ──
set -g @notif ''
set-hook -g alert-activity {
  set -gF @notif "#[fg=#191724,bg=#f6c177,bold] ● #{window_index} #{window_name} #[default]"
  run-shell -b "sleep 2 && tmux set -g @notif '' && tmux refresh-client -S"
  refresh-client -S
}
set-hook -g alert-bell {
  set -gF @notif "#[fg=#191724,bg=#eb6f92,bold]  #{window_index} #{window_name} #[default]"
  run-shell -b "sleep 3 && tmux set -g @notif '' && tmux refresh-client -S"
  refresh-client -S
}

# left: (empty) — windows begin at the left edge
set -g status-left ' '

# right: date/time  ◄ cinch (session)  ◄ heart + battery %
set -g status-right '#[fg=#403d52,bg=default,nobold]#[fg=#e0def4,bg=#403d52,bold] %a %b %d  %I:%M %p #[fg=#e0def4,bg=#403d52,nobold]#[fg=#191724,bg=#e0def4,bold] #S #[fg=#2a2739,bg=#e0def4,nobold]#[fg=#eb6f92,bg=#2a2739] ♥ #[fg=#e0def4]#(~/dotfiles/custom_scripts/tmux-battery.sh) '

# dark gap between window flags
set -g window-status-separator ''
set -g window-status-style 'fg=#908caa,bg=default'
set -g window-status-current-style 'fg=#191724,bg=default,bold'
set -g window-status-activity-style 'fg=#f6c177,bg=default'
set -g window-status-bell-style 'fg=#eb6f92,bg=default'

# inactive window: gray powerline flag   #I  #W 
set -g window-status-format '#{?#{e|m|:#{window_index},2},#[fg=#191724]#[bg=#e0def4],#[fg=#e0def4]#[bg=#2e2b40]}#[nobold] #I #W#{?window_zoomed_flag, Z,}#{?window_bell_flag, !,} #{?#{e|m|:#{window_index},2},#[fg=#e0def4],#[fg=#2e2b40]}#{?#{window_end_flag},#[bg=default],#{?#{==:#{e|-|:#{active_window_index},#{window_index}},1},#[bg=#f6c177],#{?#{e|m|:#{window_index},2},#[bg=#2e2b40],#[bg=#e0def4]}}}#[nobold]'
# active window: love powerline flag
set -g window-status-current-format '#[fg=#191724]#[bg=#f6c177]#[bold] #I #W#{?window_zoomed_flag, Z,}#{?window_bell_flag, !,} #[fg=#f6c177]#{?#{window_end_flag},#[bg=default],#{?#{e|m|:#{window_index},2},#[bg=#2e2b40],#[bg=#e0def4]}}#[nobold]'
set -g pane-border-style 'fg=#26233a,bg=default'
set -g pane-active-border-style 'fg=#eb6f92,bg=default'
set -g message-style 'fg=#191724,bg=#eb6f92'
set -g message-command-style 'fg=#191724,bg=#eb6f92'
set -g mode-style 'fg=#191724,bg=#c4a7e7'

# C-b is not acceptable -- Vim uses it
#set-option -g prefix C-a
#bind-key C-a last-window

# Sane scrolling
set -ga terminal-overrides ',xterm*:smcup@:rmcup@'

# Start numbering at 1
set -g base-index 1

# Allows for faster key repetition
set -s escape-time 0

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# Allows us to use C-a a <command> to send commands to a TMUX session inside
# another TMUX session
bind-key a send-prefix

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Vi copypaste mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind p paste-buffer

# macOS clipboard integration
set -g set-clipboard on
set -g @override_copy_command 'pbcopy'
set -g @yank_selection 'clipboard'
set -as terminal-features ',*:clipboard'

# Copy to macOS clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Double click to select word and copy to clipboard
bind-key -T root DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "pbcopy"


# hjkl pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize pane by 5
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# set to main-horizontal, 60% height for main pane
# bind m set-window-option main-pane-height 60\; select-layout main-horizontal
# set to main-vertical, 40% height for main pane
bind m set-window-option main-pane-width 100\; select-layout main-vertical

bind-key C command-prompt -p "Name of new window: " "new-window -n '%%'"

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."



# status bar
# set-option -g status-utf8 on

# https://github.com/edkolev/dots/blob/master/tmux.conf
# Updates for tmux 1.9's current pane splitting paths.

# from powerline
run-shell "tmux set-environment -g TMUX_VERSION_MAJOR $(tmux -V | cut -d' ' -f2 | cut -d'.' -f1 | sed 's/[^0-9]*//g')"
run-shell "tmux set-environment -g TMUX_VERSION_MINOR $(tmux -V | cut -d' ' -f2 | cut -d'.' -f2 | sed 's/[^0-9]*//g')"

bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"

# Visual bell and turn off the ding
set -g visual-bell off
set -g mouse on

